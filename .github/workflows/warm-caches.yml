name: Warm caches

# Actions caches saved on a PR's merge ref are invisible to every other PR;
# only caches saved on main are shared with all branches. The PR workflows
# only run on pull_request, so without this job nothing ever seeds the macOS
# pnpm/Electron/Playwright caches (or the turbo cache) on main and every new
# PR pays the full install plus a multi-minute cache re-save. This workflow
# runs on each push to main and saves those caches under the exact keys the
# PR jobs restore.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: warm-caches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"

      # Saved fresh per main commit (no restore) so the cache holds exactly the
      # artifacts for this sha and never grows unbounded. PR jobs restore it
      # via the turbo- prefix and get cache hits for unchanged packages.
      - name: Cache turbo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.sha }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          SKIP_ELECTRON_REBUILD: "1"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Seed turbo cache (build + typecheck)
        run: |
          pnpm exec turbo build --filter='@posthog/code^...'
          pnpm exec turbo typecheck

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"

      # Same keys as test.yml's integration-test job.
      - name: Cache Electron binary
        id: electron-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Everything below only needs to run when a cache is missing; macOS
      # runner minutes are 10x, so exit cheaply when main is already warm.
      - name: Install dependencies
        if: >-
          steps.node.outputs.cache-hit != 'true' ||
          steps.electron-cache.outputs.cache-hit != 'true' ||
          steps.playwright-cache.outputs.cache-hit != 'true'
        # Electron's own postinstall populates ~/Library/Caches/electron, so
        # the binary download must stay on. The Electron-ABI sqlite rebuild
        # writes only to node_modules, which is not cached, so skip it.
        run: pnpm install --frozen-lockfile
        env:
          SKIP_ELECTRON_REBUILD: "1"

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter code exec playwright install chromium
