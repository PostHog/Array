name: Agent live e2e

# Opt-in, gated live e2e for the @posthog/agent adapters (claude + codex). It
# drives real model turns against a live llm-gateway on cheap models, so it is
# deliberately NOT run per-PR: only on manual dispatch and a nightly schedule,
# and only when the repo variable AGENT_E2E_ENABLED is "true". Without the
# E2E_GATEWAY_TOKEN secret the suite self-skips every arm, and without a
# reachable E2E_GATEWAY_URL the run fails loudly rather than reporting a false
# green. The codex arm additionally self-skips if the native codex binary is not
# present on the runner. Enabling this needs: AGENT_E2E_ENABLED=true, an
# E2E_GATEWAY_TOKEN secret (a gateway OAuth token with llm_gateway:read scope),
# and an E2E_GATEWAY_URL variable pointing at a gateway reachable from the runner.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC, once a day

concurrency:
  group: agent-live-e2e
  cancel-in-progress: false

jobs:
  live-e2e:
    name: Agent live e2e (claude + codex)
    if: ${{ vars.AGENT_E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build agent dependencies
        run: |
          pnpm --filter @posthog/shared run build
          pnpm --filter @posthog/git run build
          pnpm --filter @posthog/enricher run build

      - name: Run live e2e (both adapters)
        run: pnpm --filter agent run test:e2e
        env:
          E2E_GATEWAY_TOKEN: ${{ secrets.E2E_GATEWAY_TOKEN }}
          E2E_GATEWAY_URL: ${{ vars.E2E_GATEWAY_URL }}
          E2E_CLAUDE_MODEL: ${{ vars.E2E_CLAUDE_MODEL }}
          E2E_CODEX_MODEL: ${{ vars.E2E_CODEX_MODEL }}
